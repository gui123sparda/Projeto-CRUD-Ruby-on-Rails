name: projeto-ruby-crud
services:
  db:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-rails_crud_production}
      POSTGRES_USER: ${DB_USER:-rails_crud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  web:
    build: .
    environment:
      RAILS_ENV: production
      DB_HOST: db
      DB_NAME: ${DB_NAME:-rails_crud_production}
      DB_USER: ${DB_USER:-rails_crud}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Defina SECRET_KEY_BASE no arquivo .env}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${APP_PORT:-6767}:6767'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:6767/up]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      RAILS_ENV: test
      DB_HOST: db
      DB_USER: ${DB_USER:-rails_crud}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      DB_TEST_NAME: rails_crud_test
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'bin/rails db:prepare && bin/rails test && bin/rails test:system && bin/rubocop && bin/brakeman --no-pager']
volumes:
  postgres_data:
