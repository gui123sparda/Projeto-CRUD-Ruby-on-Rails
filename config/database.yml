default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('DB_HOST', 'localhost') %>
  port: <%= ENV.fetch('DB_PORT', 5432) %>
  username: <%= ENV.fetch('DB_USER', 'rails_crud') %>
  password: <%= ENV['DB_PASSWORD'] %>
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  schema_search_path: public,treino
  migrations_paths: db/migrations

development:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'rails_crud_development') %>
test:
  <<: *default
  database: <%= ENV.fetch('DB_TEST_NAME', 'rails_crud_test') %>
production:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'rails_crud_production') %>
